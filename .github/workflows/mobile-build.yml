name: Mobile builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :androidApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SaiRen-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Generate Kotlin Multiplatform dummy framework
        run: ./gradlew :shared:generateDummyFramework
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=iosApp
      - name: Build iOS device app without code signing
        run: >-
          xcodebuild build
          -workspace iosApp/iosApp.xcworkspace
          -scheme iosApp
          -configuration Release
          -sdk iphoneos
          -derivedDataPath iosApp/build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=''
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf iosApp/build/Payload iosApp/build/unsigned
          mkdir -p iosApp/build/Payload iosApp/build/unsigned
          app_path=$(find iosApp/build/Build/Products -type d -name 'iosApp.app' -print -quit)
          test -n "$app_path"
          cp -R "$app_path" iosApp/build/Payload/SaiRen.app
          ditto -c -k --sequesterRsrc --keepParent iosApp/build/Payload iosApp/build/unsigned/SaiRen-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SaiRen-unsigned-ipa
          path: iosApp/build/unsigned/SaiRen-unsigned.ipa
          if-no-files-found: error
