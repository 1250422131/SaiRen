name: Mobile builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sair-en-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK for Kotlin Multiplatform
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=iosApp --deployment
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -workspace iosApp/iosApp.xcworkspace
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 15'
          -derivedDataPath iosApp/build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: sair-en-ios-simulator-build
          path: iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app
          if-no-files-found: error
